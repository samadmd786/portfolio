name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake ai-hangman
        run: curl -s -o /dev/null -w "%{http_code}" https://ai-hangman.streamlit.app/

      - name: Wake cloudguard
        run: curl -s -o /dev/null -w "%{http_code}" https://cloudguard.streamlit.app/
