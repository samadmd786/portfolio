name: Keep Apps Awake

on:
  schedule:
    - cron: '*/12 * * * *'   # Tombstone (Render, 15-min spindown)
    - cron: '*/20 * * * *'   # CloudGuard (Streamlit)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install playwright@latest

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Random jitter (avoid a robotic fixed interval)
        run: |
          # base cron fires every 12 min; add 0-150s jitter so pings land
          # at an irregular time each run while staying under Render's 15-min spindown
          JITTER=$(( RANDOM % 151 ))
          echo "Sleeping ${JITTER}s before waking apps"
          sleep "$JITTER"

      - name: Wake apps
        env:
          TRIGGER: ${{ github.event.schedule }}
        run: |
          node -e "
          const { chromium } = require('playwright');
          const trigger = process.env.TRIGGER || '';       // empty on manual dispatch
          const apps = [];
          // Manual run (no trigger) wakes both; otherwise only the app on that cron
          if (trigger === '' || trigger === '*/20 * * * *') apps.push('https://cloudguard.streamlit.app/');
          if (trigger === '' || trigger === '*/12 * * * *') apps.push('https://tombstone-dga7.onrender.com/');
          (async () => {
            const browser = await chromium.launch();
            for (const url of apps) {
              try {
                const page = await browser.newPage();
                await page.goto(url, { timeout: 60000 });
                try {
                  await page.click('button:has-text(\"Yes, get this app back up!\")', { timeout: 5000 });
                  await page.waitForTimeout(4000);
                  console.log('Woke (was sleeping):', url);
                } catch (_) {
                  console.log('Already awake:', url);
                }
                await page.close();
              } catch (e) {
                console.log('Error:', url, e.message);
              }
            }
            await browser.close();
          })();
          " || true

